name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project uses Xcode's JSON project format (project.xcproj), which
      # needs Xcode 27.2. The xcode-27 image defaults to an older Xcode 27.
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install swift-format
        run: |
          brew update
          brew install swift-format

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      # The engine carries the bulk of the coverage and builds in seconds, so it
      # runs before the app: a failure here should not wait on an app build.
      # The integration suite needs a real Dropbox account, which CI has no
      # business holding credentials for; it is skipped by name here and run
      # locally with AUSTER_INTEGRATION=1 (see Scripts/test.sh).
      - name: Test AusterCore
        run: swift test --package-path AusterCore --skip "IntegrationTests"

      - name: Build, analyze, and test the app
        run: >
          xcodebuild clean analyze test
          -project Auster.xcodeproj
          -scheme Auster
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES

      - name: Report test failures
        if: failure()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact \
            | python3 -c '
          import json, sys

          def walk(node, test=None):
              if node.get("nodeType") == "Test Case":
                  test = node.get("name")
              if node.get("nodeType") == "Failure Message":
                  where = node.get("sourceLocation", {})
                  file = where.get("filePath", "?").split("/")[-1]
                  line = where.get("lineNumber", "?")
                  print("%s\n    %s\n    %s:%s" % (test, node.get("name"), file, line))
              for child in node.get("children") or []:
                  walk(child, test)

          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node)
          '

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult

  # The release scripts are shell, and the release workflow runs these before it
  # spends fifteen minutes on a build. Kept in its own job so a broken script is
  # not reported as a broken app.
  scripts:
    name: Release scripts
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cmark-gfm
        run: brew install cmark-gfm

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: v1.26.0

      # Every fragment must parse and have a known kind, or the release would
      # fail at its first step.
      - name: Check the Changie fragments
        run: |
          set -euo pipefail
          if compgen -G ".changes/unreleased/*.yaml" >/dev/null; then
            changie batch auto --dry-run
          else
            echo "No unreleased changes"
          fi

      - name: Test the release scripts
        run: |
          Scripts/release/render-notes.test.sh
          Scripts/release/append-appcast-item.test.sh
