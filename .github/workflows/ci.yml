name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    # The `xcode-27` image (public preview, actions/runner-images#14404) defaults
    # to Xcode 27, matching the toolchain Auster is developed against. Without
    # that match, code that compiles locally can still fail here: Foundation
    # overload sets differ between 26.x and 27, and `macos-26` tops out at Xcode
    # 26.6. Move this back to a stable `macos-*` label once Xcode 27 ships in one.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Deliberately no setup-xcode step: the image default *is* the version we
      # want, and `latest-stable` would reject a beta toolchain.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install swift-format
        run: |
          brew update
          brew install swift-format

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      # The engine carries the bulk of the coverage and builds in seconds, so it
      # runs before the app: a failure here should not wait on an app build.
      - name: Test AusterCore
        run: swift test --package-path AusterCore

      - name: Build, analyze, and test the app
        run: >
          xcodebuild clean analyze test
          -project Auster.xcodeproj
          -scheme Auster
          -destination "platform=macOS"
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY="-"
          CODE_SIGNING_REQUIRED=YES
          CODE_SIGNING_ALLOWED=YES

      - name: Report test failures
        if: failure()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact \
            | python3 -c '
          import json, sys

          def walk(node, test=None):
              if node.get("nodeType") == "Test Case":
                  test = node.get("name")
              if node.get("nodeType") == "Failure Message":
                  where = node.get("sourceLocation", {})
                  file = where.get("filePath", "?").split("/")[-1]
                  line = where.get("lineNumber", "?")
                  print("%s\n    %s\n    %s:%s" % (test, node.get("name"), file, line))
              for child in node.get("children") or []:
                  walk(child, test)

          for node in json.load(sys.stdin).get("testNodes", []):
              walk(node)
          '

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
